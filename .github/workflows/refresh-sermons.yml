name: Refresh sermons

on:
  schedule:
    - cron: '0 16 * * 1'  # Every Monday at 4 PM UTC / 10 AM Belize (day after Sunday service)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

# `main` is protected by a ruleset that requires the "deploy" status check.
# github-actions[bot] is granted a bypass on that ruleset (Settings → Rules)
# so this job can push the sermon update straight to main. Two details make
# that safe and effective:
#   * We regenerate the VRT baselines in the SAME commit as the sermon change,
#     so the visual-regression check stays green (and keeps guarding every
#     other page) — only the intended new-sermon-card change is accepted.
#   * A push made with GITHUB_TOKEN does not trigger other workflows, so after
#     pushing we explicitly dispatch the deploy workflow to publish the site.
permissions:
  contents: write
  actions: write   # needed to dispatch the deploy workflow

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Fetch latest sermons from YouTube
        run: node scripts/fetch-sermons.mjs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet src/sermons.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new sermons — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate VRT baselines for the new sermons
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run build
          node scripts/vrt.mjs reference

      - name: Commit sermons + baselines to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/sermons.json backstop_data/bitmaps_reference/
          git commit -m "Update sermons from YouTube"
          git push origin HEAD:main

      - name: Publish the updated site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The push above won't trigger deploy on its own (GITHUB_TOKEN pushes
        # don't start workflows), so kick it off explicitly.
        run: gh workflow run deploy.yml --ref main
