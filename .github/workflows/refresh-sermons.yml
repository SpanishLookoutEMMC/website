name: Refresh sermons

on:
  schedule:
    - cron: '0 16 * * 1'  # Every Monday at 4 PM UTC / 10 AM Belize (day after Sunday service)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: write   # to trigger the deploy workflow after pushing

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # fetch-sermons.mjs is pure Node — no npm install needed
      - run: node scripts/fetch-sermons.mjs

      - name: Commit, push, and deploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/sermons.json
          if git diff --cached --quiet; then
            echo "No new sermons."
          else
            git commit -m "Update sermons from YouTube"
            git push
            # A push made with GITHUB_TOKEN doesn't trigger the deploy workflow,
            # so start it explicitly to publish the updated site.
            gh workflow run deploy.yml --ref main
          fi
