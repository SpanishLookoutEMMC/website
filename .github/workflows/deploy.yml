name: Build and Deploy

# Deploys every branch to GitHub Pages.
#
# main branch  → root of gh-pages  (production, visible at the repo Pages URL)
# other branch → previews/<branch> (preview URL posted as a PR comment)
#
# One-time setup required:
#   Settings → Pages → Source → Deploy from a branch → branch: gh-pages / (root)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:  # lets the refresh-sermons job publish after pushing to main

permissions:
  contents: write      # push built output to gh-pages branch
  pull-requests: write # post the preview URL as a PR comment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build

      - name: Deploy main to GitHub Pages root
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist
          clean: true
          clean-exclude: previews/  # keep branch preview directories intact

      - name: Deploy branch preview
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist
          target-folder: previews/${{ github.ref_name }}
          clean: true

      - name: Post preview URL on open PR
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previewUrl =
              `https://${owner}.github.io/${repo}/previews/${branch}/`;

            const { data: prs } = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });
            if (!prs.length) return;

            const pr = prs[0];
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number,
            });

            const marker = '<!-- gh-pages-preview -->';
            const body = `${marker}\n**Preview:** ${previewUrl}`;
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
            }
